# QA on every push and pull request. Vercel's build already runs `npm test`
# (no browser there); this adds the browser checks on a clean Linux machine.
name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit, lint, build checks
    runs-on: ubuntu-24.04   # Playwright has no browsers for ubuntu-latest (26.04) yet; unpin when it does
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npm test

  browser:
    name: Smoke + contrast regressions (Playwright)
    runs-on: ubuntu-24.04   # Playwright has no browsers for ubuntu-latest (26.04) yet; unpin when it does
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: test-results, retention-days: 14 }   # includes visual diffs (expected / actual / diff)

  webkit:
    name: Safari engine (WebKit, iPhone) — smoke + journeys
    runs-on: ubuntu-24.04   # Playwright has no browsers for ubuntu-latest (26.04) yet; unpin when it does
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --project=iphone
        env: { WEBKIT: '1' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: webkit-results, path: test-results, retention-days: 14 }

  lighthouse:
    name: Lighthouse (performance, accessibility, SEO, best practices)
    runs-on: ubuntu-24.04   # Playwright has no browsers for ubuntu-latest (26.04) yet; unpin when it does
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - run: node scripts/dist.mjs   # Lighthouse audits dist/, what Vercel serves
      # Accessibility, SEO and best practices are hard limits; performance warns
      # (single runs vary). Budgets: lighthouserc.json.
      - run: CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())") npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lighthouse-reports, path: qa/reports/lighthouse, retention-days: 30 }

  contrast:
    name: Full contrast audit (every route × theme × viewport × state)
    runs-on: ubuntu-24.04   # Playwright has no browsers for ubuntu-latest (26.04) yet; unpin when it does
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # Exits 1 on any confirmed failure not accepted (with a written reason)
      # in qa/contrast/baseline.json. The report is uploaded either way.
      - run: npm run qa:contrast
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: contrast-report, path: qa/reports, retention-days: 30 }
